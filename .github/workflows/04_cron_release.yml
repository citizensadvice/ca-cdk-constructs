name: Automated Release PR

# Run daily at 9 AM UTC
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  check-release-needed:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should_create_pr: ${{ steps.check.outputs.should_create_pr }}
      should_update_pr: ${{ steps.check.outputs.should_update_pr }}
      existing_pr_branch: ${{ steps.check.outputs.existing_pr_branch }}
    steps:
      - name: Checkout code
        uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5
        with:
          fetch-depth: 0 # Fetch all history for tags and commits

      - name: Setup Just
        uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b

      - name: Setup uv
        uses: citizensadvice/python-uv-setup-action@dac93858ee327eb09052711b17803ecdfa4da10b
        with:
          python_version: 3.13

      - name: Check if release PR is needed
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # First, check if there's already an open PR with "Release v" in the title
          existing_pr_data=$(gh pr list --state open --search "Release v" --json number,headRefName --jq '.[0]')

          if [ -n "$existing_pr_data" ] && [ "$existing_pr_data" != "null" ]; then
            existing_pr_number=$(echo "$existing_pr_data" | jq -r '.number')
            existing_pr_branch=$(echo "$existing_pr_data" | jq -r '.headRefName')

            echo "Found existing release PR #$existing_pr_number on branch $existing_pr_branch"
            echo "should_create_pr=false" >> $GITHUB_OUTPUT
            echo "should_update_pr=true" >> $GITHUB_OUTPUT
            echo "existing_pr_branch=$existing_pr_branch" >> $GITHUB_OUTPUT
            exit 0
          fi

          # No existing PR found
          echo "should_update_pr=false" >> $GITHUB_OUTPUT

          # Get the latest tag
          latest_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -z "$latest_tag" ]; then
            echo "No tags found, proceeding with release PR"
            echo "should_create_pr=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Latest tag: $latest_tag"

          # Get the date of the latest tag (in seconds since epoch)
          tag_date=$(git log -1 --format=%ct "$latest_tag")
          current_date=$(date +%s)
          days_since_release=$(( (current_date - tag_date) / 86400 ))

          echo "Days since last release: $days_since_release"

          # Check if main dependencies have changed using the Justfile command
          # This command outputs "true" or "false"
          deps_changed=$(just check-deps-changed "$latest_tag")

          # Cooldown period: 4 days
          cooldown_days=4

          if [ "$deps_changed" = "true" ] && [ "$days_since_release" -ge "$cooldown_days" ]; then
            echo "should_create_pr=true" >> $GITHUB_OUTPUT
            echo "Release conditions met: dependencies changed and cooldown period passed"
          else
            echo "should_create_pr=false" >> $GITHUB_OUTPUT
            if [ "$deps_changed" = "false" ]; then
              echo "No dependency changes since last release"
            else
              echo "Cooldown period not met (need $cooldown_days days, only $days_since_release passed)"
            fi
          fi

  create-version-bump-pr:
    needs: check-release-needed
    if: needs.check-release-needed.outputs.should_create_pr == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5
        with:
          fetch-depth: 0

      - name: Setup Just
        uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b

      - name: Setup uv
        uses: citizensadvice/python-uv-setup-action@dac93858ee327eb09052711b17803ecdfa4da10b
        with:
          python_version: 3.13

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create release branch
        id: branch
        run: |
          branch_name=$(just create-release-automatic-update-branch)
          echo "branch_name=$branch_name" >> $GITHUB_OUTPUT
          echo "Created branch: $branch_name"

      - name: Bump patch version and commit
        id: bump
        run: |
          just bump-and-commit-uv patch
          new_version=$(just get-version)
          echo "new_version=$new_version" >> $GITHUB_OUTPUT
          echo "Bumped to version: $new_version"

      - name: Push version bump
        run: just push-branch-to-origin ${{ steps.branch.outputs.branch_name }}

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
        run: just create-automatic-update-pr ${{ steps.bump.outputs.new_version }} ${{ steps.branch.outputs.branch_name }}

  update-version-bump-pr:
    needs: check-release-needed
    if: needs.check-release-needed.outputs.should_update_pr == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update PR branch with latest main
        run: |
          branch_name="${{ needs.check-release-needed.outputs.existing_pr_branch }}"
          echo "Updating branch: $branch_name"

          # Fetch and checkout the PR branch
          git fetch origin "$branch_name"
          git checkout "$branch_name"

          # Rebase on top of main to include latest changes
          git rebase origin/main

          # Force push the updated branch
          git push origin "$branch_name" --force-with-lease

          echo "Successfully updated $branch_name with latest changes from main"
